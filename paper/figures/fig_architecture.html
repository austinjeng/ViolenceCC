<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; padding: 20px; background: white; }
  svg { display: block; margin: 0 auto; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 680" width="2100" height="680"
     font-family="Arial, Helvetica, sans-serif">

  <!-- Background -->
  <rect width="2100" height="680" fill="white"/>

  <!-- ============================================================ -->
  <!-- INPUT: Video Frames -->
  <!-- ============================================================ -->
  <rect x="30" y="250" width="140" height="80" rx="6" fill="#f8f9fa" stroke="#2c3e50" stroke-width="2"/>
  <text x="100" y="285" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">Video</text>
  <text x="100" y="305" text-anchor="middle" font-size="14" fill="#555">Frames</text>

  <!-- Film strip icon hint -->
  <rect x="45" y="260" width="8" height="5" rx="1" fill="#bdc3c7"/>
  <rect x="45" y="268" width="8" height="5" rx="1" fill="#bdc3c7"/>
  <rect x="45" y="276" width="8" height="5" rx="1" fill="#bdc3c7"/>

  <!-- ============================================================ -->
  <!-- SKELETON PATH (top) -->
  <!-- ============================================================ -->

  <!-- Arrow: Video -> RTMPose -->
  <line x1="170" y1="270" x2="230" y2="170" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- RTMPose -->
  <rect x="230" y="130" width="160" height="70" rx="6" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2"/>
  <text x="310" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">RTMPose</text>
  <text x="310" y="178" text-anchor="middle" font-size="12" fill="#7f8c8d">Skeleton Extraction</text>
  <text x="310" y="193" text-anchor="middle" font-size="11" fill="#95a5a6">COCO-17 keypoints</text>

  <!-- Arrow: RTMPose -> CTR-GCN -->
  <line x1="390" y1="165" x2="450" y2="165" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- CTR-GCN -->
  <rect x="450" y="130" width="170" height="70" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  <text x="535" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#27ae60">CTR-GCN</text>
  <text x="535" y="178" text-anchor="middle" font-size="12" fill="#7f8c8d">GCN Backbone</text>
  <!-- Frozen badge -->
  <rect x="572" y="135" width="42" height="16" rx="3" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="0.8"/>
  <text x="593" y="147" text-anchor="middle" font-size="9" fill="#27ae60" font-weight="bold">frozen</text>

  <!-- Arrow: CTR-GCN -> 256-d -->
  <line x1="620" y1="165" x2="680" y2="165" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Skeleton Features -->
  <rect x="680" y="140" width="120" height="50" rx="6" fill="#f8f9fa" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="740" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">256-d</text>
  <text x="740" y="179" text-anchor="middle" font-size="11" fill="#7f8c8d">Skeleton feat.</text>

  <!-- ============================================================ -->
  <!-- VISUAL PATH (bottom) -->
  <!-- ============================================================ -->

  <!-- Arrow: Video -> Visual Backbone -->
  <line x1="170" y1="310" x2="230" y2="410" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Visual Backbone -->
  <rect x="230" y="370" width="180" height="80" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="2"/>
  <text x="320" y="398" text-anchor="middle" font-size="15" font-weight="bold" fill="#2980b9">Visual Backbone</text>
  <text x="320" y="418" text-anchor="middle" font-size="12" fill="#7f8c8d">CLIP / SigLIP2</text>
  <text x="320" y="435" text-anchor="middle" font-size="11" fill="#95a5a6">ViT-B/16 variants</text>
  <!-- Frozen badge -->
  <rect x="362" y="375" width="42" height="16" rx="3" fill="#2980b9" opacity="0.15" stroke="#2980b9" stroke-width="0.8"/>
  <text x="383" y="387" text-anchor="middle" font-size="9" fill="#2980b9" font-weight="bold">frozen</text>

  <!-- Arrow: Visual Backbone -> Snippet Pooling -->
  <line x1="410" y1="410" x2="470" y2="410" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Snippet Pooling -->
  <rect x="470" y="380" width="140" height="55" rx="6" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="540" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">Snippet</text>
  <text x="540" y="422" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">Pooling</text>

  <!-- Arrow: Snippet Pooling -> Visual Features -->
  <line x1="610" y1="407" x2="670" y2="407" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Visual Features -->
  <rect x="670" y="380" width="140" height="50" rx="6" fill="#f8f9fa" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="740" y="403" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">512-1536d</text>
  <text x="740" y="419" text-anchor="middle" font-size="11" fill="#7f8c8d">Visual feat.</text>

  <!-- ============================================================ -->
  <!-- FUSION MODULE (center) -->
  <!-- ============================================================ -->

  <!-- Fusion container -->
  <rect x="870" y="100" width="380" height="390" rx="10" fill="#fef9e7" stroke="#f39c12" stroke-width="2.5"/>
  <text x="1060" y="130" text-anchor="middle" font-size="17" font-weight="bold" fill="#e67e22">Fusion Module</text>

  <!-- Arrow: Skeleton feat -> Fusion -->
  <line x1="800" y1="165" x2="870" y2="200" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Arrow: Visual feat -> Fusion -->
  <line x1="810" y1="405" x2="870" y2="370" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Late Fusion block -->
  <rect x="910" y="155" width="300" height="65" rx="6" fill="white" stroke="#95a5a6" stroke-width="1.5"/>
  <text x="1060" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Late Fusion</text>
  <text x="1060" y="200" text-anchor="middle" font-size="12" fill="#7f8c8d">Concatenation + FC projection</text>

  <!-- OR divider -->
  <text x="1060" y="238" text-anchor="middle" font-size="13" fill="#95a5a6" font-style="italic">-- or --</text>

  <!-- Gated Fusion block -->
  <rect x="910" y="255" width="300" height="100" rx="6" fill="white" stroke="#e74c3c" stroke-width="2"/>
  <text x="1060" y="283" text-anchor="middle" font-size="14" font-weight="bold" fill="#e74c3c">Gated Fusion</text>
  <text x="1060" y="303" text-anchor="middle" font-size="12" fill="#555">Learned gate: g = sigma(W[s;v])</text>
  <text x="1060" y="323" text-anchor="middle" font-size="12" fill="#555">f = g*s + (1-g)*v</text>

  <!-- LayerNorm block with TTA dotted border -->
  <rect x="935" y="365" width="250" height="50" rx="6" fill="#fdedec" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="1060" y="387" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">LayerNorm</text>
  <text x="1060" y="405" text-anchor="middle" font-size="11" fill="#e74c3c">Adapted by TTA</text>

  <!-- TTA annotation with bracket -->
  <rect x="935" y="425" width="250" height="45" rx="4" fill="none" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="1060" y="445" text-anchor="middle" font-size="12" font-weight="bold" fill="#8e44ad">TTA (TENT / SAR)</text>
  <text x="1060" y="462" text-anchor="middle" font-size="10" fill="#8e44ad">Entropy minimization on LN params</text>

  <!-- ============================================================ -->
  <!-- MIL HEAD (right) -->
  <!-- ============================================================ -->

  <!-- Arrow: Fusion -> MIL Head -->
  <line x1="1250" y1="290" x2="1340" y2="290" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- MIL Head -->
  <rect x="1340" y="240" width="180" height="100" rx="6" fill="#f5eef8" stroke="#8e44ad" stroke-width="2"/>
  <text x="1430" y="275" text-anchor="middle" font-size="15" font-weight="bold" fill="#8e44ad">MIL Head</text>
  <text x="1430" y="298" text-anchor="middle" font-size="12" fill="#555">FC + Sigmoid</text>
  <text x="1430" y="318" text-anchor="middle" font-size="11" fill="#7f8c8d">Top-k snippet selection</text>

  <!-- Arrow: MIL Head -> Output -->
  <line x1="1520" y1="290" x2="1600" y2="290" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Output: Anomaly Score -->
  <rect x="1600" y="255" width="160" height="70" rx="6" fill="#e8f8f5" stroke="#1abc9c" stroke-width="2"/>
  <text x="1680" y="283" text-anchor="middle" font-size="15" font-weight="bold" fill="#1abc9c">Anomaly</text>
  <text x="1680" y="303" text-anchor="middle" font-size="15" font-weight="bold" fill="#1abc9c">Score</text>
  <text x="1680" y="320" text-anchor="middle" font-size="12" fill="#7f8c8d">[0, 1]</text>

  <!-- ============================================================ -->
  <!-- TRAINING SIGNAL -->
  <!-- ============================================================ -->

  <!-- MIL Ranking Loss annotation -->
  <rect x="1340" y="370" width="180" height="50" rx="6" fill="white" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="1430" y="392" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">MIL Ranking</text>
  <text x="1430" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Loss</text>

  <!-- Arrow: Loss -> MIL Head (upward, training signal) -->
  <line x1="1430" y1="370" x2="1430" y2="345" stroke="#e74c3c" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrowhead-red)"/>
  <text x="1470" y="360" font-size="10" fill="#c0392b" font-style="italic">train</text>

  <!-- ============================================================ -->
  <!-- DIMENSION ANNOTATIONS on arrows -->
  <!-- ============================================================ -->
  <text x="660" y="152" text-anchor="middle" font-size="10" fill="#95a5a6">T x 256</text>
  <text x="660" y="396" text-anchor="middle" font-size="10" fill="#95a5a6">T x d</text>
  <text x="1300" y="278" text-anchor="middle" font-size="10" fill="#95a5a6">T x 256</text>

  <!-- ============================================================ -->
  <!-- SECTION LABELS -->
  <!-- ============================================================ -->
  <text x="100" y="50" font-size="18" font-weight="bold" fill="#2c3e50">Input</text>
  <text x="400" y="50" font-size="18" font-weight="bold" fill="#2c3e50">Feature Extraction (Frozen)</text>
  <text x="960" y="50" font-size="18" font-weight="bold" fill="#e67e22">Trainable Fusion</text>
  <text x="1440" y="50" font-size="18" font-weight="bold" fill="#8e44ad">Prediction</text>

  <!-- Thin horizontal line under section labels -->
  <line x1="30" y1="60" x2="1770" y2="60" stroke="#ecf0f1" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- Path labels -->
  <!-- ============================================================ -->
  <text x="400" y="100" font-size="13" fill="#27ae60" font-weight="bold">Skeleton Path</text>
  <text x="400" y="360" font-size="13" fill="#2980b9" font-weight="bold">Visual Path</text>

  <!-- ============================================================ -->
  <!-- Arrow marker definitions -->
  <!-- ============================================================ -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2c3e50"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e74c3c"/>
    </marker>
  </defs>

</svg>
</body>
</html>
