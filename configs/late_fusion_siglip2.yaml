# configs/late_fusion_siglip2.yaml
# Phase 8: SigLIP2 Late Fusion baseline. Mirrors late_fusion.yaml with SigLIP2 features.
seed: 42
dataset: ucf

paths:
  skeleton_features: "E:/features/ucf/skeleton"
  clip_features: "E:/features/ucf/siglip2"
  splits_dir: "data/splits"
  results_dir: "results"
  snippet_boundaries_dir: "E:/snippets/ucf"

model:
  variant: late_fusion
  skel_dim: 256
  clip_dim: 1536
  proj_dim: 512
  head_hidden: [128, 32]
  dropout: 0.3
  alpha: equal             # D-08 default; switch to 'learned' only if equal underperforms

data:
  T: 32
  batch_size: 16
  num_workers: 4
  pin_memory: true

train:
  lr: 1.0e-4
  weight_decay: 1.0e-2
  epochs: 50
  warmup_epochs: 5
  patience: 10
  k_topk: 3
  margin: 1.0
  lam_sparse: 8.0e-3
  lam_smooth: 8.0e-4

wandb:
  project: violencecc
  mode: disabled          # Rule 3 fallback: wandb preflight exit 2 (no API key); run CSV-only per plan 04-06 Step A Option C
  tags: [phase8, late_fusion, ucf, siglip2]
