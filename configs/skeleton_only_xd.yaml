# configs/skeleton_only_xd.yaml
# Phase 4c: XD-Violence Skeleton-Only MIL baseline. Mirrors skeleton_only.yaml with XD paths.
seed: 42
dataset: xd

paths:
  skeleton_features: "E:/features/xd/skeleton"
  clip_features: "E:/features/xd/clip"
  splits_dir: "data/splits"
  results_dir: "results"

model:
  variant: skeleton_only
  skel_dim: 256
  head_hidden: [128, 32]
  dropout: 0.3

data:
  T: 32
  batch_size: 16          # D-04: 16 normal + 16 abnormal = 32 videos per step
  num_workers: 4
  pin_memory: true

train:
  lr: 1.0e-4              # TRN-01
  weight_decay: 1.0e-2
  epochs: 50
  warmup_epochs: 5
  patience: 10            # TRN-02
  k_topk: 3               # D-01
  margin: 1.0             # D-02
  lam_sparse: 8.0e-3      # D-03
  lam_smooth: 0.0      # D-03

wandb:
  project: violencecc     # D-13
  mode: disabled          # Rule 3 fallback: wandb preflight exit 2 (no API key); run CSV-only per plan 04-06 Step A Option C
  tags: [phase4c, skeleton_only, xd]
