# configs/gated_fusion_xd_clip_mean.yaml
# Phase 4c D-23 XD: CLIP mean-only pooling ablation.
# Reuses model.variant=gated_fusion with clip_dim=512 (matches the [N, 512]
# cache produced by scripts/extract_clip.py --pool=mean). Skeleton side uses
# the default M-pool cache ([N, 256]); no skel_agg field needed.
seed: 42
dataset: xd

paths:
  skeleton_features: "E:/features/xd/skeleton"
  clip_features: "E:/features/xd/clip_mean"
  splits_dir: "data/splits"
  results_dir: "results"

model:
  variant: gated_fusion
  skel_dim: 256
  clip_dim: 512
  shared_dim: 256
  head_hidden: [128, 32]
  dropout: 0.3

data:
  T: 32
  batch_size: 16
  num_workers: 4
  pin_memory: true

train:
  lr: 1.0e-4
  weight_decay: 1.0e-2
  epochs: 50
  warmup_epochs: 5
  patience: 10
  k_topk: 3
  margin: 1.0
  lam_sparse: 8.0e-3
  lam_smooth: 0.0

wandb:
  project: violencecc
  mode: disabled          # Rule 3 fallback: wandb preflight exit 2 (no API key); run CSV-only per plan 04-06 Step A Option C
  tags: [phase4c, gated_fusion, xd, clip_mean]
