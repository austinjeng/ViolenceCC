# configs/rtfm_i3d_flow.yaml
# Plan 04b-05 Task 3 remediation diagnostic (Option A): swap RGB cache for Flow.
# Same model + hyperparams as rtfm_i3d.yaml; only paths.i3d_features differs.
#
# Rationale: the RGB I3D cache is truncated at the V/W/Y alphabetical tail
# (729 train+val videos missing, 18% data loss). Flow cache is 100% complete.
# Directory junction E:/i3d-features-flow/ exposes Flow as RGB/ + FlowTest as
# RGBTest/ so the existing I3DFeatureDataset + test_loader code requires no edit.

seed: 42
dataset: xd_i3d

paths:
  i3d_features: "E:/i3d-features-flow"    # NTFS junction: RGB->Flow, RGBTest->FlowTest
  splits_dir: "data/splits"
  results_dir: "results"

model:
  variant: rtfm_i3d
  i3d_dim: 1024
  head_hidden: [128, 32]
  dropout: 0.3

data:
  T: 32
  batch_size: 3
  num_workers: 4
  pin_memory: true

train:
  lr: 1.0e-4
  weight_decay: 1.0e-2
  epochs: 50
  warmup_epochs: 5
  patience: 10
  k_topk: 3
  margin: 1.0
  lam_sparse: 8.0e-3
  lam_smooth: 8.0e-4

wandb:
  project: violencecc
  mode: disabled
  tags: [phase4b, rtfm_i3d, xd_i3d, i3d_flow, remediation]

# ----------------------------------------------------------------------------
# Diagnostic context (Plan 04b-05 Task 3 HUMAN-UAT remediation Option A):
#   Original RGB rerun:  AP=0.6570 (11.11pp below RTFM 77.81% gate)
#                        + 729 missing train+val videos (V/W/Y tail)
#   This run:            Flow-only (100% coverage); same arch, same hyperparams
#                        + expected seed determinism matches smoke loss at E0
#   Pass threshold:      AP >= 0.7681 (RTFM 77.81%, +/-1%) — same as RGB gate
# ----------------------------------------------------------------------------
